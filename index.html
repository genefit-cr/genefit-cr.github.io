<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E0F12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://raw.githubusercontent.com https://cdn.jsdelivr.net; connect-src 'self' https://*.googleapis.com https://raw.githubusercontent.com https://cdn.jsdelivr.net https://www.gstatic.com https://fonts.googleapis.com https://fonts.gstatic.com; frame-src https://genefit-1a52a.firebaseapp.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<title>Genefit</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Genefit">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800;900&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de una columna (máx. 560 px) con barra inferior fija; lima de competencia sobre grafito; fotos de ejercicios en un solo tono */
:root{
  --bg:#0E0F12; --card:#17191E; --raise:#1F2229; --line:#2A2E36; --fg:#F2F3F0; --muted:#A7ADB6; --dim:#7C838E;
  --accent:#D4FF3A; --ink:#0E0F12; --ok-bg:#1E2A0B; --ok-line:#3F5512; --ok-fg:#B9C49A; --ok-pill:#24320C;
  --warn:#FFB066; --warn-bg:#3A2410; --gold:#FFD84A; --gold-bg:#2E2A0A; --danger:#FF6B5E;
  --m-pri:#FF5A4A; --m-sec:#FFA23A; --m-off:#3A3F48; --m-body:#262A31;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif; --body:"Inter",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg);margin:0}
[hidden]{display:none!important}
img{max-width:100%}
#app{padding-top:env(safe-area-inset-top,0px)}
body{font-family:var(--body);font-size:16px;line-height:1.4;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 104px}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--display);font-weight:900;font-size:30px;line-height:1.05}
h2{font-family:var(--display);font-weight:900;font-size:26px;line-height:1.05}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.eyebrow.ac{color:var(--accent)}
.small{font-size:14px;color:var(--muted)}
.tiny{font-size:12px;color:var(--muted);font-weight:600}
.num{font-variant-numeric:tabular-nums}
.big{font-family:var(--display);font-weight:900;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.big .u{font-family:var(--body);font-size:14px;font-weight:600;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.stack.s8{gap:8px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.card{background:var(--card);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card.line{border:1px solid var(--line)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile{background:var(--card);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.btn{border:0;border-radius:14px;min-height:48px;padding:0 16px;font-weight:700;font-size:16px;background:var(--raise);color:var(--fg);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.primary{background:var(--accent);color:var(--ink)}
.btn.go{min-height:60px;border-radius:18px;font-family:var(--display);font-weight:900;font-size:20px;letter-spacing:.04em;text-transform:uppercase}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{background:transparent;border:1px solid var(--line);color:var(--danger)}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px;border-radius:12px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;flex:none}
.iconbtn svg{width:20px;height:20px}
.link{background:none;border:0;padding:6px 0;color:var(--muted);font-weight:600;font-size:15px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{flex:none;min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--fg);font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--ink);border-color:var(--fg)}
.chip.sm{min-height:32px;padding:0 10px;font-size:13px}
.tag{display:inline-flex;align-items:center;padding:4px 10px;border-radius:999px;background:var(--raise);font-size:13px;font-weight:600}
.pill{flex:none;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--ok-pill);color:var(--accent)}
.pill.pr{background:var(--gold-bg);color:var(--gold)}
.pill.alerta{background:var(--warn-bg);color:var(--warn)}
.pill.nada{background:var(--raise);color:var(--muted)}
.input{width:100%;min-width:0;background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px;color:var(--fg)}
textarea.input{resize:vertical;min-height:74px}
.input::placeholder{color:var(--dim)}
label.lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.notice{background:var(--raise);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--muted);line-height:1.45}
.empty{text-align:center;color:var(--muted);padding:22px 8px;font-size:15px}
.avatar{width:44px;height:44px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;color:var(--fg)}
.avatar.lg{width:60px;height:60px;font-size:22px}
/* Fotos de ejercicios: un solo tono para que todas se vean parejas */
.tono{filter:grayscale(1) contrast(1.08) brightness(.96)}
.mini{width:56px;height:56px;border-radius:14px;flex:none;background:var(--raise);object-fit:cover;display:block}
.mini.s44{width:44px;height:44px;border-radius:12px}
.mini.sq{width:100%;height:auto;aspect-ratio:1;max-width:100%;border-radius:12px}
.badge{width:56px;height:56px;border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:900;font-size:14px;color:var(--ink);background:var(--accent)}
.badge.s44{width:44px;height:44px;border-radius:12px;font-size:12px}
.foto{position:relative;width:100%;max-width:100%;aspect-ratio:3/2;overflow:hidden;background:var(--raise)}
.foto .fr{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:none}
.foto .anim{animation:alterna 2.6s ease-in-out infinite}
@keyframes alterna{0%,35%{opacity:0}50%,85%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.foto .anim{animation:none;opacity:0}}
/* Barra de navegación */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#121418;border-top:1px solid #22252C;padding:6px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
#nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
#nav .in.c5{grid-template-columns:repeat(5,minmax(0,1fr))}
/* Modo coach: otra óptica */
.rol{font-family:var(--display);font-weight:800;font-size:11px;letter-spacing:.14em;padding:4px 8px;border-radius:6px;background:var(--accent);color:var(--ink)}
body.coach .top{border-bottom:1px solid #22252C;padding-bottom:12px;margin-bottom:4px}
body.coach #nav{background:#0B0C0F;border-top:2px solid var(--accent)}
.pill.mal{background:#3A1512;color:var(--danger)}
.pills{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
#nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--muted);font-size:12px;font-weight:600;position:relative}
#nav button svg{width:24px;height:24px}
#nav button[aria-current="page"]{color:var(--accent)}
#nav .dot{position:absolute;top:4px;right:calc(50% - 18px);width:9px;height:9px;border-radius:50%;background:var(--accent)}
/* Encabezado */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:18px}
.marca{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:900;font-size:15px;letter-spacing:.14em}
.marca i{width:26px;height:26px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center}
.marca i svg{width:16px;height:16px}
/* Semana */
.semana{display:flex;justify-content:space-between;background:var(--card);border-radius:18px;padding:12px 14px}
.dia{display:flex;flex-direction:column;align-items:center;gap:6px;width:36px}
.dia b{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;background:var(--raise);color:var(--muted)}
.dia.hecho b{background:var(--accent);color:var(--ink)}
.dia.hoy b{background:transparent;border:2px solid var(--accent);color:var(--fg)}
/* Sesión */
.ses-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 12px;display:flex;flex-direction:column;gap:12px;border-bottom:1px solid #22252C}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.prog{height:6px;border-radius:3px;background:#22252C;overflow:hidden}
.prog i{display:block;height:100%;border-radius:3px;background:var(--accent);transition:width .25s linear}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}}
.rest{display:flex;align-items:center;gap:10px;background:var(--ok-bg);border:1px solid var(--ok-line);border-radius:18px;padding:12px}
.ring{width:52px;height:52px;border-radius:50%;border:4px solid var(--accent);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:900;font-size:14px;flex:none}
.rest .btn{min-height:40px;padding:0 10px;font-size:14px;border:1px solid var(--ok-line);background:transparent}
.sets{display:grid;grid-template-columns:34px minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) 48px;gap:8px;align-items:center}
.sets .h{font-size:12px;color:var(--muted);font-weight:600;text-align:center}
.sets .n{font-family:var(--display);font-weight:800;color:var(--muted);text-align:center}
.sets .pv{text-align:center;font-size:13px;color:var(--muted)}
.sets input{width:100%;min-width:0;height:44px;border-radius:12px;border:1px solid transparent;background:var(--raise);text-align:center;font-weight:700;font-size:16px;color:var(--fg)}
.sets .done{opacity:.5}
.check{width:48px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--raise);color:var(--dim);display:flex;align-items:center;justify-content:center}
.check.on{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.exname{background:none;border:0;padding:0;text-align:left;color:var(--fg);font-weight:700;font-size:17px}
/* Colores según el sexo del cliente: azul (hombre) o rosa (mujer). El coach conserva el lima. */
body.tema-m{--accent:#4DA8FF;--ok-bg:#0B1E33;--ok-line:#1D4A7A;--ok-fg:#A9C8EA;--ok-pill:#0E2A47}
body.tema-f{--accent:#FF6EB4;--ok-bg:#331020;--ok-line:#6E2249;--ok-fg:#EBB0CC;--ok-pill:#3D1229}
.chip.sx{flex:1;min-height:52px;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px}
.chip.sx i{width:14px;height:14px;border-radius:50%;display:inline-block}
.chip.sx[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:var(--ink)}
/* Sesión: superseries y tipo de serie */
.card.ss{border-left:4px solid var(--accent);padding-left:14px}
.sets button.n{background:none;border:0;padding:0;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.sets button.n small{font-family:var(--body);font-size:10px;font-weight:700;color:var(--muted)}
.sets button.pv{background:none;border:0;padding:0;min-height:44px;font:inherit;font-size:13px;color:var(--muted)}
.sets button.pv:not(:disabled){text-decoration:underline dotted;text-underline-offset:3px}
/* Estadísticas */
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:var(--card);border-radius:999px;padding:4px}
.tabs .chip{border:0;padding:0 4px;font-size:13px;min-height:36px}
.lect{min-height:20px;font-size:14px;font-weight:600;color:var(--fg)}
.chart .pt{fill:var(--accent);stroke:var(--card);stroke-width:2}
.chart .pt.sel{stroke:var(--fg)}
.chart .br{fill:var(--accent);opacity:.55}.chart .br.sel{opacity:1}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.cal button{aspect-ratio:1;max-width:44px;width:100%;margin:0 auto;border-radius:50%;border:0;background:transparent;color:var(--muted);font-weight:600;font-size:14px;padding:0}
.cal button.on{background:var(--accent);color:var(--ink);font-weight:800}
.cal button.hoy{box-shadow:inset 0 0 0 2px var(--fg)}
.mrow{display:grid;grid-template-columns:92px minmax(0,1fr) 30px;align-items:center;gap:8px}
.mb{height:10px;background:var(--raise);border-radius:0 4px 4px 0}.mb i{display:block;height:100%;background:var(--accent);border-radius:0 4px 4px 0}
.mrow b{text-align:right}
.hrow{border-top:1px solid var(--line)}.hrow:first-child{border-top:0}
.hrow summary{display:flex;align-items:center;gap:10px;padding:10px 0;cursor:pointer;list-style:none}
.hrow summary::-webkit-details-marker{display:none}
/* Progresión y dolor en el entreno */
.sug{font-size:13px;font-weight:600;padding:6px 10px;border-radius:10px;background:var(--raise);color:var(--muted)}
.sug.sube{background:var(--ok-bg);color:var(--accent)}
.aviso{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--warn);background:var(--warn-bg);border-radius:10px;padding:6px 6px 6px 10px}
/* Animación 3D en la ficha */
.v3d{position:relative;width:100%;aspect-ratio:1/1;max-height:64vh;background:radial-gradient(circle at 50% 38%,#2B3242 0%,#1A1D24 55%,var(--bg) 100%);touch-action:pan-y;overflow:hidden}
.v3d canvas{display:block;width:100%!important;height:100%!important;opacity:0;transition:opacity .3s}
.v3d.listo canvas{opacity:1}
.v3d-hint{position:absolute;left:16px;bottom:14px;font-size:12px;font-weight:600;color:var(--muted);background:rgba(14,15,18,.6);padding:4px 8px;border-radius:8px;pointer-events:none}
.v3d-pausa{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:10px;background:rgba(14,15,18,.7);border:0;color:var(--fg)}
.vtog{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:calc(16px + env(safe-area-inset-top,0px));display:flex;gap:4px;background:rgba(14,15,18,.7);padding:4px;border-radius:999px}
.vtog .chip{border:0;min-height:32px}
@media (prefers-reduced-motion:reduce){.v3d canvas{transition:none}}
/* Hojas y pantallas superpuestas */
.sheet-bg{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:88vh;border-radius:24px 24px 0 0;display:flex;flex-direction:column;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet>*{flex:none}
.sheet>.body{flex:1 1 auto;min-height:0;overflow-y:auto;margin-top:12px;display:flex;flex-direction:column;gap:12px}
.pick{display:flex;align-items:center;gap:12px;background:none;border:0;padding:6px 2px;border-radius:12px;text-align:left;width:100%;color:var(--fg)}
.pick:hover{background:var(--raise)}
#ficha{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.hero{position:relative}
.hero .sombra{position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,15,18,.55) 0%,rgba(14,15,18,0) 30%,rgba(14,15,18,0) 60%,var(--bg) 100%);pointer-events:none}
.hero .volver{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:calc(16px + env(safe-area-inset-top,0px));background:rgba(14,15,18,.7);border:0;color:var(--fg)}
.hero .lbl{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:calc(24px + env(safe-area-inset-top,0px));padding:6px 10px;border-radius:10px;background:rgba(14,15,18,.7);font-size:12px;font-weight:600}
.ficha-body{max-width:560px;margin:-30px auto 0;position:relative;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.paso{display:flex;gap:12px}
.paso span:first-child{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--ink);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.paso span:last-child{font-size:15px;line-height:1.45;color:#D5D9DF}
.mapa{width:100%;max-width:280px;height:auto;display:block;margin:0 auto}
.mapa .mt{fill:var(--muted);font-size:10px;font-family:var(--body)}
.leg{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:-1px}
/* Fotos de progreso */
.thumbs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.thumb{position:relative;border:2px solid transparent;border-radius:12px;overflow:hidden;padding:0;background:var(--raise);aspect-ratio:3/4;max-width:100%}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .cap{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;font-size:12px;padding:14px 6px 4px;text-align:left}
.thumb.selA{border-color:var(--accent)}.thumb.selB{border-color:var(--gold)}
.thumb .t{position:absolute;top:6px;left:6px;border-radius:6px;padding:1px 6px;font-size:11px;font-weight:700}
.compare{position:relative;aspect-ratio:3/4;max-width:100%;border-radius:16px;overflow:hidden;background:var(--raise);user-select:none}
.compare img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.compare .bar{position:absolute;top:0;bottom:0;width:3px;background:#fff;transform:translateX(-1px)}
.compare .lab{position:absolute;top:10px;padding:3px 8px;border-radius:8px;background:rgba(0,0,0,.65);color:#fff;font-size:12px;font-weight:600}
.range{width:100%;accent-color:var(--accent)}
.switch{flex:none;width:50px;height:30px;border-radius:15px;padding:3px;display:flex;background:#343944;border:0}
.switch i{width:24px;height:24px;border-radius:50%;background:var(--muted)}
.switch[aria-checked="true"]{background:var(--accent);justify-content:flex-end}
.switch[aria-checked="true"] i{background:var(--ink)}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}
.list-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.list-row:first-child{border-top:0}
/* Chat */
.msgs{display:flex;flex-direction:column;gap:8px}
.msg{max-width:82%;padding:10px 12px;border-radius:16px;font-size:15px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word}

/* Pasos de técnica: traducción guardada (si existe) → inglés de la base pública */
let PASOS=undefined,INSTR=null;const TRAD={};
async function pasosES(){if(PASOS!==undefined)return PASOS;try{const r=await fetch('pasos.json');PASOS=r.ok?await r.json():null}catch(e){PASOS=null}return PASOS}
async function instrEN(id){if(!INSTR){INSTR={};for(const u of ['https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/dist/exercises.json','https://cdn.jsdelivr.net/gh/yuhonas/free-exercise-db@main/dist/exercises.json']){try{const a=await(await fetch(u)).json();a.forEach(x=>INSTR[x.id]=x.instructions||[]);break}catch(e){}}}return INSTR[id]||[]}
async function cargarPasos(e){
  const pintar=(l,nota)=>{const el=$('#pasos');if(!el)return;el.innerHTML=(nota?`<div class="small">${esc(nota)}</div>`:'')+l.map((x,i)=>`<div class="paso"><span>${i+1}</span><span>${esc(x)}</span></div>`).join('')};
  const P=await pasosES();if(P&&P[e.id]?.length)return pintar(P[e.id]);
  if(TRAD[e.id])return pintar(TRAD[e.id]);
  if(S.db){try{const d=await S.db.doc('trad/'+e.id).get();if(d.exists&&Array.isArray(d.data().pasos)){TRAD[e.id]=d.data().pasos;return pintar(TRAD[e.id])}}catch(x){}}
  const en=await instrEN(e.id);if(!$('#pasos'))return;
  if(!en.length){$('#pasos').innerHTML='<div class="small">Este ejercicio no tiene instrucciones.</div>';return}
  pintar(en,'Instrucciones en inglés:')}

async function escribir(fn,ok){
  try{await fn();if(ok)toast(ok);return true}
  catch(e){console.warn(e);const c=e?.code||'';
    if(c==='permission-denied')mostrarFallo('No tienes permiso para guardar eso. Si eres el coach, revisa que pegaste las reglas de Firestore.');
    else if(c==='resource-exhausted')toast('Se llenó el espacio gratis de Genefit por hoy. Inténtalo más tarde.');
    else mostrarFallo('No se pudo guardar.\nCódigo: '+(c||'?')+'\n'+(e?.message||e));
    return false}}

let unsubCoach=null;
function init(){
  render();
  if(!window.firebase||!FIREBASE_CONFIG||!FIREBASE_CONFIG.apiKey){S.sinConfig=true;S.listo=true;render();return}
  firebase.initializeApp(FIREBASE_CONFIG);
  S.auth=firebase.auth();S.db=firebase.firestore();
  try{S.db.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
  S.auth.onAuthStateChanged(u=>{
    cortar('comun');cortar('modo');cortar('det');cortar('chat');cortar('retos');cortar('ranking');
    if(!u){S.me=null;S.listo=true;S.vista=null;render();return}
    S.me=u.uid;S.meName=u.displayName||'';S.listo=false;S.coachId=undefined;render();
    sub('comun',S.db.doc('config/coach'),s=>{
      // Esperar a que el servidor confirme: las reglas solo dejan ver los datos del coach cuando ya está guardado.
      if(s.metadata.hasPendingWrites)return;
      const antes=S.esOwner,primera=S.coachId===undefined;
      S.coachId=s.exists?s.data().uid:null;S.coachNombre=s.exists?(s.data().nombre||''):'';S.coachCfg=s.exists?s.data():{};S.sinCoach=!s.exists;
      S.esOwner=S.coachId===S.me;
      if(primera||antes!==S.esOwner){S.modo=S.esOwner?ls.get('gf-modo','coach'):'cliente';arrancarModo()}
      S.listo=true},null,{includeMetadataChanges:true});
  });
}
function arrancarModo(){cortar('modo');cortar('det');cortar('chat');cortar('retos');cortar('ranking');S.retos=[];S.retoYo={};S.det=null;S.chat=null;
  S.tab=S.modo==='coach'?'clientes':'hoy';if(S.vista!=='sesion')S.vista=null;
  if(S.modo==='coach')suscribirCoach();else suscribirCliente()}
async function serCoach(){const nombre=($('#cnom')?.value||S.meName||'').trim().slice(0,40)||'Coach';
  await escribir(()=>S.db.doc('config/coach').set({uid:S.me,nombre}),'¡Listo! Ya eres el coach de Genefit')}
function suscribirCliente(){
  S.perfil=undefined;S.acceso=S.esOwner?null:undefined;
  if(!S.esOwner)sub('modo',S.db.doc('acceso/'+S.me),s=>{S.acceso=s.exists?s.data():null;crearSiFalta()},()=>{S.acceso=null;crearSiFalta()});
  sub('modo',S.db.doc(BASE()),s=>{S.perfil=s.exists?{id:s.id,...s.data()}:null;crearSiFalta()});
  sub('modo',S.db.collection(BASE()+'/historial').orderBy('fecha','desc').limit(150),s=>S.hist=docs(s));
  sub('modo',S.db.collection(BASE()+'/records'),s=>S.recs=docs(s));
  sub('modo',S.db.collection(BASE()+'/asignadas'),s=>S.asig=docs(s).sort((a,b)=>(a.fecha||0)-(b.fecha||0)));
  sub('modo',S.db.collection(BASE()+'/mensajes').orderBy('fecha','desc').limit(150),s=>S.msgs=docs(s).reverse());
  sub('modo',S.db.collection(PRIV()+'/rutinas'),s=>S.rut=docs(s).sort((a,b)=>(a.orden||0)-(b.orden||0)));
  sub('modo',S.db.collection(PRIV()+'/medidas'),s=>S.med=docs(s).sort((a,b)=>a.fecha-b.fecha));
  sub('modo',S.db.collection(PRIV()+'/fotos'),s=>S.fotos=docs(s));
  sub('modo',S.db.collection(BASE()+'/comprobantes').orderBy('fecha','desc').limit(3),s=>S.comp=docs(s));
  suscribirRetos();
}
function crearSiFalta(){if(S.perfil!==null||S.acceso===undefined||restringido()||!S.meName||S.creando)return;S.creando=true;
  const base={alias:S.meName.slice(0,40),alta:Date.now(),compartir:false,v:2};
  // Si las reglas publicadas aún no conocen "sexo", se crea sin ese campo (el color queda guardado en el teléfono).
  S.db.doc(BASE()).set(S.sexoNuevo?{...base,sexo:S.sexoNuevo}:base).catch(e=>{if(S.sexoNuevo&&e?.code==='permission-denied')return S.db.doc(BASE()).set(base);throw e}).then(()=>S.creando=false,e=>{S.creando=false;console.warn(e)})}
function suscribirCoach(){
  sub('modo',S.db.collection('clientes'),s=>S.clientes=docs(s));
  sub('modo',S.db.collection('acceso'),s=>{S.accesos=docs(s);S.sinReglasAcceso=false},()=>{S.accesos=[];S.sinReglasAcceso=true});
  sub('modo',S.db.collection('plantillas'),s=>S.plantillas=docs(s).sort((a,b)=>(a.orden||0)-(b.orden||0)));
  suscribirRetos();
}
function cambiarModo(m){if(S.vista==='sesion'&&m==='coach'){S.vista=null}S.modo=m;ls.set('gf-modo',m);arrancarModo();render();scrollTo(0,0)}

async function crearPerfil(ev){ev.preventDefault();const alias=$('#alias').value.trim().slice(0,40);

/* ================= CLIENTE: Hoy ================= */
function rutinaDeHoy(){
  const A=S.asig;if(!A.length)return null;const d=hoyDow();
  const delDia=A.filter(a=>Array.isArray(a.dias)&&a.dias.includes(d));
  if(delDia.length)return delDia[0];
  const conDias=A.filter(a=>a.dias?.length);const libres=A.filter(a=>!a.dias?.length);
  const pool=libres.length?libres:A;if(conDias.length&&!libres.length){ // la próxima por día
    let mejor=null,dist=8;for(const a of A)for(const x of a.dias){const k=(x-d+7)%7;if(k<dist){dist=k;mejor=a}}return mejor?{...mejor,proxima:dist}:A[0]}
  const ult=S.hist.find(h=>pool.some(a=>a.nombre===h.rutina));
  if(!ult)return pool[0];const i=pool.findIndex(a=>a.nombre===ult.rutina);return pool[(i+1)%pool.length]}
function racha(){if(!S.hist.length)return 0;const sem=new Set(S.hist.map(h=>lunes(h.fecha)));let w=lunes(Date.now()),n=0;
  if(!sem.has(w))w-=7*DIA;while(sem.has(w)){n++;w-=7*DIA}return n}

  if(S.ses){const all=S.ses.ejercicios.flatMap(e=>e.sets);h+=`<div class="card line" style="border-color:var(--ok-line);background:var(--ok-bg)"><span class="eyebrow ac">En curso</span><h2>${esc(S.ses.rutina)}</h2><span class="small" style="color:var(--ok-fg)">${all.filter(x=>x.ok).length} de ${all.length} series · empezaste ${hace(S.ses.inicio)}</span><button class="btn primary go" onclick="abrirSesion()">${IC.play} Continuar</button></div>`}

      ${r.nota?`<div class="row" style="align-items:flex-start;background:var(--raise);border-radius:14px;padding:12px;gap:10px"><span style="color:var(--accent);flex:none;width:18px;height:18px;display:flex">${IC.chat}</span><span style="font-size:15px;color:#D5D9DF">${esc(r.nota)}</span></div>`:''}

function filaRutina(a,tipo,quien){const exs=a.ejercicios||[];

/* ================= Sesión de entrenamiento ================= */
/* Serie: {kg,reps,ok,t,rpe}  t: n normal · w calentamiento · f al fallo · d drop set
   Ejercicio: {k,nombre,desc,sets,sig,nota}  sig=true: va en superserie con el siguiente */
const TIPOS={n:{l:'Normal'},w:{l:'Calentamiento',c:'C',col:'var(--warn)'},f:{l:'Al fallo',c:'F',col:'var(--danger)'},d:{l:'Drop set',c:'D',col:'var(--gold)'}};
const RPES=[6,7,7.5,8,8.5,9,9.5,10];
const DESCANSOS=[0,30,45,60,90,120,180,240];
function iniciar(tipo,id){
  if(S.ses){abrirSesion();return toast('Ya tienes un entrenamiento en curso')}
  const r=tipo==='asig'?S.asig.find(x=>x.id===id):tipo==='rut'?S.rut.find(x=>x.id===id):{nombre:'Entrenamiento libre',ejercicios:[]};if(!r)return;
  S.ses={rutina:r.nombre,inicio:Date.now(),descFin:0,descTotal:0,
    ejercicios:(r.ejercicios||[]).map(e=>{const sg=progresionActiva()?sugerencia(e.nombre,+e.reps):null,peso=sg&&sg.kg>=(+e.kg||0)?sg.kg:+e.kg||0;
      return {k:uid(),nombre:e.nombre,desc:+e.desc||90,sig:!!e.sig,nota:'',obj:+e.reps||0,sug:sg&&peso===sg.kg?{accion:sg.accion,txt:sg.txt}:null,sets:Array.from({length:+e.series||1},()=>({kg:peso,reps:+e.reps||10,ok:false,t:'n'}))}})};
  guardarSes();abrirSesion();pedirWake()}
function abrirSesion(){S.vista='sesion';render();scrollTo(0,0)}
function minimizar(){S.vista=null;S.tab='hoy';render();scrollTo(0,0)}
let wake=null;function pedirWake(){try{navigator.wakeLock?.request('screen').then(w=>wake=w).catch(()=>{})}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.vista==='sesion')pedirWake()});
function ultimo(n){for(const h of S.hist){const e=(h.detalle||[]).find(x=>x.nombre===n);if(e)return e.sets}return null}
const efectiva=x=>x.t!=='w';
function totales(){const all=S.ses.ejercicios.flatMap(e=>e.sets),ok=all.filter(x=>x.ok);return{all:all.length,hechas:ok.length,vol:ok.filter(efectiva).reduce((a,x)=>a+x.kg*x.reps,0)}}
function siguiente(){for(const e of S.ses.ejercicios){const j=e.sets.findIndex(x=>!x.ok);if(j>=0)return `${e.nombre} · serie ${etiqueta(e.sets,j)} · ${fmt(e.sets[j].kg)} kg × ${e.sets[j].reps}`}return 'Terminaste todas las series'}
/* Letra de superserie de cada ejercicio ('' si va solo) */
function grupos(L){let n=0;return L.map((e,i)=>{const unido=e.sig&&i<L.length-1,previo=i>0&&L[i-1].sig;if(!unido&&!previo)return'';if(!previo)n++;return String.fromCharCode(64+n)})}
/* Número de la serie: los calentamientos no cuentan y se marcan con C; al fallo F; drop D */
function etiqueta(sets,j){const x=sets[j];if(x.t&&x.t!=='n')return TIPOS[x.t].c;return String(sets.slice(0,j+1).filter(s=>s.t!=='w').length)}

        <input class="${d}" id="kg-${e.k||i}-${j}" type="number" inputmode="decimal" step="2.5" min="0" value="${x.kg}" aria-label="Kilos serie ${lb}" onchange="setSet(${i},${j},'kg',this.value)">
        <input class="${d}" id="rp-${e.k||i}-${j}" type="number" inputmode="numeric" min="0" value="${x.reps}" aria-label="Repeticiones serie ${lb}" onchange="setSet(${i},${j},'reps',this.value)">
        <button class="check ${x.ok?'on':''}" aria-pressed="${x.ok}" aria-label="Marcar serie ${lb}" onclick="marcar(${i},${j})">${IC.check}</button>`}).join('')}</div>
      <button class="btn sm ghost block" style="border-style:dashed" onclick="otraSerie(${i})">+ Agregar serie</button></section>`});
  return h+`<button class="btn ghost block" onclick="abrirBiblioteca(n=>{S.ses.ejercicios.push({k:uid(),nombre:n,desc:90,sig:false,nota:'',sets:[{kg:0,reps:10,ok:false,t:'n'}]});guardarSes();render()})">+ Agregar ejercicio</button>

   <span class="lbl">RPE: qué tan dura fue</span><div class="chips">${[0,...RPES].map(r=>`<button class="chip sm" aria-pressed="${(x.rpe||0)===r}" onclick="cambiarSerie(${i},${j},'rpe',${r})">${r?fmt(r):'Sin RPE'}</button>`).join('')}</div>
   <span class="small">10 = no podías hacer ni una repetición más · 8 = te quedaban 2. Los calentamientos no cuentan para récords ni volumen.</span>
   <div class="${e.sets.length>1?'grid2':'stack'}">${e.sets.length>1?`<button class="btn danger" onclick="quitarSerie(${i},${j})">Eliminar serie</button>`:''}<button class="btn primary" onclick="cerrarHoja()">Listo</button></div></div>`)}
function cambiarSerie(i,j,k,v){const x=S.ses.ejercicios[i].sets[j];if(k==='rpe')x.rpe=v||null;else x.t=v;guardarSes();render();menuSerie(i,j)}
function quitarSerie(i,j){S.ses.ejercicios[i].sets.splice(j,1);guardarSes();cerrarHoja();render()}
/* Hoja de un ejercicio: descanso, superserie, nota, mover, reemplazar, quitar */
function menuEj(i){const L=S.ses.ejercicios,e=L[i],sig=L[i+1];

   <div class="body"><span class="lbl">Descanso entre series</span><div class="chips">${DESCANSOS.map(d=>`<button class="chip sm" aria-pressed="${e.desc===d}" onclick="S.ses.ejercicios[${i}].desc=${d};guardarSes();render();menuEj(${i})">${d?(d<60?d+' s':mmss(d)):'Apagado'}</button>`).join('')}</div>
   ${sig?`<button class="btn ${e.sig?'ghost':'primary'} block" onclick="S.ses.ejercicios[${i}].sig=${!e.sig};guardarSes();render();menuEj(${i})">${e.sig?'Quitar la superserie':'Hacer superserie con «'+esc(sig.nombre)+'»'}</button><span class="small">En superserie no hay descanso entre un ejercicio y el otro: descansas al terminar la vuelta.</span>`:''}
   <div class="field"><label class="lbl" for="ejNota">Nota</label><textarea class="input" id="ejNota" maxlength="200" placeholder="Ej: asiento en 4, agarre cerrado" oninput="S.ses.ejercicios[${i}].nota=this.value;guardarSes()">${esc(e.nota||'')}</textarea></div>
   <div class="grid2"><button class="btn ghost" ${i?'':'disabled'} onclick="moverEj(${i},-1)">Subir</button><button class="btn ghost" ${sig?'':'disabled'} onclick="moverEj(${i},1)">Bajar</button></div>

function moverEj(i,d){const L=S.ses.ejercicios,k=i+d;if(k<0||k>=L.length)return;[L[i],L[k]]=[L[k],L[i]];guardarSes();render();menuEj(k)}
function reemplazarEj(i){abrirBiblioteca(n=>{S.ses.ejercicios[i].nombre=n;guardarSes();render()})}
function ajustar(d){if(!d){S.ses.descFin=0}else{S.ses.descFin+=d*1000;S.ses.descTotal=Math.max(1,S.ses.descTotal+d)}guardarSes();tick()}
function descartar(b){if(!b.dataset.ok){b.dataset.ok=1;b.textContent='Toca otra vez para descartar';return}S.ses=null;guardarSes();try{wake?.release()}catch(e){}wake=null;S.vista=null;S.tab='hoy';render();toast('Entrenamiento descartado')}
/* Aviso de fin de descanso: vibración, pitido y notificación si la app está en segundo plano */
let audio=null;
function prepararAudio(){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume()}catch(e){}}
function pitido(){try{if(!audio||ls.get('gf-mudo',false))return;const t=audio.currentTime;[0,.22,.44].forEach((d,k)=>{const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=k===2?1320:880;
  g.gain.setValueAtTime(.0001,t+d);g.gain.exponentialRampToValueAtTime(.35,t+d+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d+.17);o.connect(g).connect(audio.destination);o.start(t+d);o.stop(t+d+.2)})}catch(e){}}
function pedirPermisoAviso(){if(!('Notification' in window)||Notification.permission!=='default'||ls.get('gf-aviso-pedido',false))return;ls.set('gf-aviso-pedido',true);try{Notification.requestPermission()}catch(e){}}
async function avisarDescanso(){try{navigator.vibrate?.([200,100,200])}catch(e){}pitido();
  if(document.visibilityState==='hidden'&&'Notification' in window&&Notification.permission==='granted'){const body='Siguiente: '+siguiente();
    try{const r=await navigator.serviceWorker?.getRegistration();if(r)await r.showNotification('Descanso terminado',{body,icon:'icons/icon-192.png',badge:'icons/favicon-32.png',tag:'descanso',renotify:true,vibrate:[200,100,200]});else new Notification('Descanso terminado',{body})}catch(e){}}
  else toast('Descanso terminado: siguiente serie')}
let timer=null,avisado=true;
function tick(){clearTimeout(timer);if(!S.ses)return;
  const rest=Math.ceil((S.ses.descFin-Date.now())/1000),c=$('#clock'),box=$('#descanso');
  if(rest<=0&&S.ses.descFin){S.ses.descFin=0;guardarSes();if(!avisado){avisado=true;avisarDescanso()}}
  if(c&&box&&S.vista==='sesion'){c.textContent=mmss(Math.floor((Date.now()-S.ses.inicio)/1000));
    if(rest>0){box.hidden=false;$('#rclock').textContent=mmss(rest);$('#bar').style.width=Math.min(100,rest/S.ses.descTotal*100)+'%'}
    else{box.hidden=true;const t=totales();$('#bar').style.width=(t.all?t.hechas/t.all*100:0)+'%'}}
  timer=setTimeout(tick,S.ses.descFin||S.vista==='sesion'?250:1000)}
function abrirTerminar(){const t=totales(),min=Math.max(1,Math.round((Date.now()-S.ses.inicio)/60000));
  abrirHoja(`<div class="row between"><h2>Guardar entrenamiento</h2><button class="iconbtn" onclick="cerrarHoja()" aria-label="Cerrar">${IC.x}</button></div>
   <div class="body"><div class="grid3"><div class="tile" style="background:var(--raise)"><span class="tiny">Duración</span><span class="big" style="font-size:22px">${min} <span class="u">min</span></span></div><div class="tile" style="background:var(--raise)"><span class="tiny">Series</span><span class="big" style="font-size:22px">${t.hechas}</span></div><div class="tile" style="background:var(--raise)"><span class="tiny">Volumen</span><span class="big" style="font-size:22px">${kg(t.vol)}</span></div></div>
   ${t.hechas?'':'<div class="notice">No marcaste ninguna serie como hecha. Marca con ✓ las series que hiciste para que cuenten.</div>'}
   <div class="field"><label class="lbl" for="ft">Título</label><input class="input" id="ft" value="${esc(S.ses.rutina)}" maxlength="80"></div>
   <div class="field"><label class="lbl" for="fn">Nota para tu coach (opcional)</label><textarea class="input" id="fn" maxlength="300" placeholder="¿Cómo te sentiste?"></textarea></div>
   <button class="btn primary go" id="btnGuardar" onclick="guardarSesion()">Guardar</button></div>`)}
async function guardarSesion(){
  const s=S.ses,titulo=$('#ft').value.trim()||s.rutina,nota=$('#fn').value.trim();$('#btnGuardar').disabled=true;
  const f=Date.now(),prs=[],ejercicios=[],detalle=[],recW=[];let series=0,reps=0,vol=0;
  s.ejercicios.forEach(e=>{const ok=e.sets.filter(x=>x.ok);if(!ok.length)return;const ef=ok.filter(efectiva);
    const m=(ef.length?ef:ok).reduce((a,x)=>x.kg>a.kg||(x.kg===a.kg&&x.reps>a.reps)?x:a);
    series+=ef.length;reps+=ef.reduce((a,x)=>a+x.reps,0);vol+=ef.reduce((a,x)=>a+x.kg*x.reps,0);
    ejercicios.push({nombre:e.nombre,series:ef.length,mejor:`${fmt(m.kg)} kg × ${m.reps}`});
    detalle.push({nombre:e.nombre,sets:ok.map(x=>{const o={kg:x.kg,reps:x.reps};if(x.t&&x.t!=='n')o.t=x.t;if(x.rpe)o.rpe=x.rpe;return o})});
    const rec=S.recs.find(r=>r.id===slug(e.nombre));if(ef.length&&m.kg>0&&(!rec||m.kg>rec.kg)){prs.push(e.nombre);recW.push([slug(e.nombre),{nombre:e.nombre,kg:m.kg,reps:m.reps,fecha:f}])}});
  const min=Math.max(1,Math.round((f-s.inicio)/60000)),id='w'+uid();
  const ok=await escribir(async()=>{
    await S.db.doc(BASE()+'/historial/'+id).set({titulo,rutina:s.rutina,fecha:f,min,series,reps,volumen:Math.round(vol),ejercicios,prs,nota,detalle});
    for(const [k,v] of recW)await S.db.doc(BASE()+'/records/'+k).set(v);
    await S.db.doc(BASE()).update({ultimo:f,ultTitulo:titulo,ultMin:min,ultPRs:prs.length,ultVol:Math.round(vol)});
  });
  if(!ok){const b=$('#btnGuardar');if(b)b.disabled=false;return}
  {const H2=[{id,fecha:f,prs,detalle,series,volumen:Math.round(vol)},...S.hist.filter(h=>h.id!==id)];S.db.doc(BASE()).update({tend:tendencias(H2)}).catch(e=>console.warn('tend',e));actualizarRetos(H2)}
  cerrarHoja();S.ses=null;guardarSes();try{wake?.release()}catch(e){}wake=null;S.vista=null;S.tab='hoy';render();scrollTo(0,0);
  toast(prs.length?`¡Guardado! ${prs.length} récord${prs.length>1?'s':''} nuevo${prs.length>1?'s':''}: ${prs.join(', ')}`:'¡Entrenamiento guardado! Tu coach ya lo puede ver.')}

/* ================= Editor de rutinas (cliente y coach) ================= */
function nuevaRutina(dest){S.edit={dest,id:null};S.draft={nombre:'',ejercicios:[]};S.vista='editor';render();scrollTo(0,0)}
function editarRutina(id,dest='rutina'){const src=(dest==='plantilla'?S.plantillas:dest==='asignada'?S.det?.asig||[]:S.rut).find(x=>x.id===id);if(!src)return;S.edit={dest,id,cid:dest==='asignada'?S.det.id:null};S.draft=JSON.parse(JSON.stringify({nombre:src.nombre,ejercicios:src.ejercicios||[],orden:src.orden||0}));S.vista='editor';render();scrollTo(0,0)}
function vEditor(){const r=S.draft,nuevo=!S.edit.id;
  return `<div class="stack" style="padding-top:18px"><div class="row"><button class="iconbtn" onclick="salirEditor()" aria-label="Volver">${IC.back}</button><h1 class="grow" style="font-size:24px">${nuevo?'Nueva rutina':S.edit.dest==='asignada'?'Ajustar para '+esc(nombreDe(S.edit.cid)):'Editar rutina'}</h1></div>
   ${S.edit.dest==='asignada'?'<div class="notice">Estos cambios son solo para este cliente. Tu plantilla no cambia.</div>':''}
   <div class="field"><label class="lbl" for="rn">Nombre</label><input class="input" id="rn" value="${esc(r.nombre)}" placeholder="Ej: Torso A" maxlength="60" oninput="S.draft.nombre=this.value"></div>
   ${r.ejercicios.length?r.ejercicios.map((e,i)=>`<section class="card" style="gap:10px"><div class="row">${mini(e.nombre,'mini s44')}<button class="exname grow" style="font-size:16px" onclick="abrirFicha(${J(e.nombre)})">${esc(e.nombre)}</button>
      <button class="iconbtn" onclick="mover(${i})" ${i===0?'disabled':''} aria-label="Subir">${IC.arriba}</button><button class="iconbtn" onclick="S.draft.ejercicios.splice(${i},1);render()" aria-label="Quitar ${esc(e.nombre)}">${IC.x}</button></div>
      ${i<r.ejercicios.length-1?`<button class="chip sm" style="align-self:flex-start" aria-pressed="${!!e.sig}" onclick="S.draft.ejercicios[${i}].sig=!S.draft.ejercicios[${i}].sig;render()">${e.sig?'✓ En superserie con el siguiente':'Superserie con el siguiente'}</button>`:''}
      <div class="grid4">${[['series','Series',1],['reps','Reps',1],['kg','Kg',2.5],['desc','Desc. s',15]].map(([k,l,st])=>`<div class="field"><label class="tiny" for="e${i}${k}">${l}</label><input class="input num" style="text-align:center;padding:10px 4px" id="e${i}${k}" type="number" inputmode="decimal" step="${st}" min="0" value="${esc(e[k])}" oninput="S.draft.ejercicios[${i}].${k}=+this.value"></div>`).join('')}</div></section>`).join(''):'<div class="notice">Agrega ejercicios desde la biblioteca. Puedes ver cómo se hace cada uno antes de agregarlo.</div>'}
   <button class="btn ghost block" onclick="abrirBiblioteca(n=>{S.draft.ejercicios.push({nombre:n,series:3,reps:10,kg:0,desc:90});render()})">+ Agregar ejercicio</button>
   <button class="btn primary go" onclick="guardarRutina()">Guardar rutina</button>
   ${nuevo?'':`<button class="btn danger block" onclick="borrarRutina(this)">Eliminar rutina</button>`}</div>`}
function mover(i){const a=S.draft.ejercicios;if(i<1)return;[a[i-1],a[i]]=[a[i],a[i-1]];render()}
function salirEditor(){S.vista=S.edit?.dest==='asignada'&&S.det?'cliente':null;S.draft=null;render()}
function colRut(){return S.edit.dest==='plantilla'?'plantillas':S.edit.dest==='asignada'?`clientes/${S.edit.cid}/asignadas`:PRIV()+'/rutinas'}
async function guardarRutina(){const d=S.draft;if(!d.nombre.trim())return toast('Ponle un nombre a la rutina');if(!d.ejercicios.length)return toast('Agrega al menos un ejercicio');
  const id=S.edit.id||'r'+uid();const body={nombre:d.nombre.trim(),ejercicios:d.ejercicios.map((e,i)=>({nombre:e.nombre,series:Math.max(1,+e.series||1),reps:+e.reps||0,kg:+e.kg||0,desc:+e.desc||90,...(e.sig&&i<d.ejercicios.length-1?{sig:true}:{})})),orden:d.orden||Date.now()};
  const asg=S.edit.dest==='asignada';if(asg)delete body.orden;
  if(await escribir(()=>S.db.collection(colRut()).doc(id).set(body,{merge:asg}),S.edit.dest==='plantilla'?'Rutina guardada. Ahora tócale «Asignar a clientes».':asg?'Rutina ajustada para '+nombreDe(S.edit.cid):'Rutina guardada'))salirEditor()}
async function borrarRutina(b){if(!b.dataset.ok){b.dataset.ok=1;b.textContent='Toca otra vez para eliminar';return}
  if(await escribir(()=>S.db.collection(colRut()).doc(S.edit.id).delete(),'Rutina eliminada'))salirEditor()}

/* ================= CLIENTE: Progreso ================= */
const MED=[['peso','Peso','kg'],['grasa','Grasa','%'],['cintura','Cintura','cm'],['pecho','Pecho','cm'],['brazo','Brazo','cm'],['pierna','Pierna','cm']];
function lineaPeso(M){const pts=M.filter(m=>m.peso!=null);if(pts.length<2)return'';
  const W=330,H=124,min=Math.min(...pts.map(p=>p.peso)),max=Math.max(...pts.map(p=>p.peso)),rg=(max-min)||1,t0=pts[0].fecha,tr=(pts.at(-1).fecha-t0)||1;
  const X=t=>12+(t-t0)/tr*(W-24),Y=v=>16+(max-v)/rg*(H-46);const d=pts.map((p,i)=>`${i?'L':'M'}${X(p.fecha).toFixed(1)},${Y(p.peso).toFixed(1)}`).join(' ');const l=pts.at(-1),dif=Math.round((l.peso-pts[0].peso)*10)/10;
  return `<div class="stack s8"><div class="row between"><b style="font-size:15px">Peso corporal</b><span class="small" style="color:var(--accent);font-weight:700">${dif>0?'+':''}${fmt(dif)} kg desde ${fecha(t0)}</span></div>
   <svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Peso: de ${fmt(pts[0].peso)} a ${fmt(l.peso)} kg"><line x1="0" x2="${W}" y1="${H-24}" y2="${H-24}" stroke="var(--line)"/>
    <path d="${d} L${X(l.fecha)},${H-24} L12,${H-24} Z" fill="var(--accent)" opacity=".14"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${X(l.fecha)}" cy="${Y(l.peso)}" r="5" fill="var(--accent)"/><text x="12" y="${H-6}">${fecha(t0)}</text><text x="${W-12}" y="${H-6}" text-anchor="end">${fecha(l.fecha)}</text>
    <text x="${Math.min(W-12,X(l.fecha))}" y="${Math.max(12,Y(l.peso)-10)}" text-anchor="end" style="fill:var(--fg);font-weight:700">${fmt(l.peso)} kg</text></svg></div>`}
const PTABS=[['resumen','Resumen'],['ejercicios','Ejercicios'],['cuerpo','Cuerpo'],['historial','Historial']];
function vProgreso(){const t=S.progTab||'resumen';
  return `<div class="stack" style="padding-top:12px"><h1>Tu progreso</h1><div class="tabs" role="tablist">${PTABS.map(([k,l])=>`<button class="chip" role="tab" aria-selected="${t===k}" aria-pressed="${t===k}" onclick="S.progTab='${k}';render()">${l}</button>`).join('')}</div>
   ${({resumen:progResumen,ejercicios:progEjercicios,cuerpo:progCuerpo,historial:progHistorial}[t]||progResumen)()}</div>`}
function progCuerpo(){
  const M=S.med,ult=M.at(-1),peso=[...M].reverse().find(m=>m.peso!=null)?.peso,H=S.hist;
  let h=`<div class="grid3"><div class="tile"><span class="tiny">Peso</span><span class="big">${peso!=null?fmt(peso):'—'}</span><span class="tiny">kg</span></div><div class="tile"><span class="tiny">Medidas</span><span class="big">${M.length}</span><span class="tiny">registros</span></div><div class="tile"><span class="tiny">Fotos</span><span class="big">${S.fotos.length}</span></div></div>`;
  if(S.perfil?.sexo)h+=`<section class="card"><b>Color de la app</b>${sexoChips(S.perfil.sexo,'elegirSexo')}</section>`;
  h+=`<section class="card"><div class="row between"><b>Compartir mi progreso con mi coach</b><button class="switch" role="switch" aria-checked="${!!S.perfil?.compartir}" aria-label="Compartir medidas y fotos con mi coach" onclick="toggleCompartir(this)"><i></i></button></div>
   <span class="small">${S.perfil?.compartir?'Tu coach ve tus medidas y fotos de progreso.':'Tus medidas y fotos son solo tuyas. Tu coach ve tus entrenamientos y récords.'}</span></section>`;
  h+=`<section class="card">${lineaPeso(M)||'<b>Medidas</b>'}
   ${ult?`<div class="grid3">${MED.map(([k,l,u])=>{const v=ult[k];if(v==null)return`<div><div class="tiny">${l}</div><div class="small">—</div></div>`;const first=M.find(m=>m[k]!=null)[k],d=Math.round((v-first)*10)/10;
     return `<div><div class="tiny">${l}</div><div class="big" style="font-size:20px">${fmt(v)} <span class="u">${u}</span></div>${M.length>1&&d?`<div class="tiny num">${d>0?'+':''}${fmt(d)} ${u}</div>`:''}</div>`}).join('')}</div>`:'<span class="small">Registra tu peso y medidas para ver tu evolución.</span>'}
   <details ${ult?'':'open'}><summary style="font-weight:700;cursor:pointer;padding:6px 0;color:var(--accent)">Registrar medidas de hoy</summary>
   <form class="stack" style="margin-top:10px" onsubmit="guardarMedidas(event)"><div class="grid3">${MED.map(([k,l,u])=>`<div class="field"><label class="tiny" for="m-${k}">${l} (${u})</label><input class="input num" id="m-${k}" type="number" inputmode="decimal" step="0.1" min="0" placeholder="${ult?.[k]!=null?fmt(ult[k]):''}"></div>`).join('')}</div>
   <button class="btn primary block">Guardar medidas</button></form></details></section>`;
  const F=S.fotos.filter(f=>f.pose===S.pose).sort((a,b)=>a.fecha-b.fecha);
  if(!F.find(f=>f.id===S.cmpA))S.cmpA=F[0]?.id||null;if(!F.find(f=>f.id===S.cmpB))S.cmpB=F.length>1?F.at(-1).id:null;
  h+=`<section class="card"><div class="row between"><b>Antes y después</b><span class="small">${S.perfil?.compartir?'Compartidas con tu coach':'Solo tú las ves'}</span></div>
   <div class="chips" role="group" aria-label="Pose">${['Frente','Lado','Espalda'].map(p=>`<button class="chip" aria-pressed="${p===S.pose}" onclick="S.pose='${p}';render()">${p}</button>`).join('')}</div>
   <label class="btn primary block" for="foto-in">${IC.cam} Agregar foto de ${S.pose.toLowerCase()}</label><input id="foto-in" type="file" accept="image/*" hidden onchange="subirFoto(this)">
   `;
  if(F.length>1){const A=F.find(f=>f.id===S.cmpA),B=F.find(f=>f.id===S.cmpB);
    h+=`<div class="compare"><img src="${esc(B.img)}" alt="Después"><img id="cmpTop" src="${esc(A.img)}" alt="Antes" style="clip-path:inset(0 ${100-S.cmpPos}% 0 0)"><div class="bar" id="cmpBar" style="left:${S.cmpPos}%"></div>
      <span class="lab" style="left:10px">Antes · ${fecha(A.fecha)}</span><span class="lab" style="right:10px">Después · ${fecha(B.fecha)}</span></div>
      <input class="range" id="cmpR" type="range" min="0" max="100" value="${S.cmpPos}" aria-label="Deslizar comparación" oninput="moverCmp(this.value)">
      <span class="small">${Math.round((B.fecha-A.fecha)/DIA)} días de diferencia. Toca una foto para elegirla como antes o después.</span>`}
  h+=F.length?`<div class="thumbs">${[...F].reverse().map(f=>`<button class="thumb ${f.id===S.cmpA?'selA':''} ${f.id===S.cmpB?'selB':''}" onclick="elegirFoto(${J(f.id)})" aria-label="Foto del ${fecha(f.fecha)}"><img src="${esc(f.img)}" alt="" loading="lazy">
     ${f.id===S.cmpA?'<span class="t" style="background:var(--accent);color:var(--ink)">Antes</span>':f.id===S.cmpB?'<span class="t" style="background:var(--gold);color:var(--ink)">Después</span>':''}<span class="cap">${fecha(f.fecha)}</span></button>`).join('')}</div>
     ${S.cmpB||S.cmpA?`<button class="btn danger sm" onclick="borrarFoto(this)">Eliminar la foto marcada como «${S.cmpB?'Después':'Antes'}»</button>`:''}`:`<div class="empty">Aún no tienes fotos de ${S.pose.toLowerCase()}.</div>`;
  h+='</section>';
  return h}
function progHistorial(){const H=S.hist;let h='';
  const R=[...S.recs].sort((a,b)=>b.fecha-a.fecha);
  h+=`<section class="card"><b>Récords personales</b><div>${R.length?R.map(r=>`<div class="list-row"><div class="row grow">${mini(r.nombre,'mini s44')}<span class="grow">${esc(r.nombre)}</span></div><div style="text-align:right" class="num"><b>${fmt(r.kg)} kg</b><div class="small">× ${r.reps} · 1RM ${fmt(Math.round(e1rm(r.kg,r.reps)))} · ${hace(r.fecha)}</div></div></div>`).join(''):'<div class="small">Tu primer récord aparece al terminar un entrenamiento con peso.</div>'}</div></section>`;
  h+=`<section class="card"><b>Historial</b><div>${H.length?H.slice(0,60).map(x=>`<details class="hrow"><summary><div class="grow"><b>${esc(x.titulo)}</b>${x.prs?.length?' <span class="pill pr">'+x.prs.length+' récord'+(x.prs.length>1?'s':'')+'</span>':''}<div class="small">${new Date(x.fecha).toLocaleDateString('es-CR',{weekday:'short',day:'numeric',month:'short'})} · ${x.min} min · ${x.series} series</div></div><span class="num" style="font-weight:700">${kg(x.volumen)} kg</span></summary>
     <div class="small" style="padding:0 0 10px;line-height:1.6">${(x.detalle||[]).map(e=>`<b style="color:var(--fg)">${esc(e.nombre)}</b> ${esc(setsTxt(e.sets))}`).join('<br>')}${x.nota?`<div style="color:var(--fg);margin-top:4px">«${esc(x.nota)}»</div>`:''}</div></details>`).join(''):'<div class="small">Aún no hay entrenamientos guardados.</div>'}</div></section>`;
  return h}
async function guardarMedidas(ev){ev.preventDefault();const d={fecha:Date.now()};let n=0;
  MED.forEach(([k])=>{const v=parseFloat(String($('#m-'+k).value).replace(',','.'));if(!isNaN(v)&&v>0){d[k]=v;n++}});if(!n)return toast('Escribe al menos una medida');
  const id='m'+uid();await escribir(async()=>{await S.db.doc(PRIV()+'/medidas/'+id).set(d);if(S.perfil?.compartir)await S.db.doc(BASE()+'/medidas/'+id).set(d)},'Medidas guardadas')}
function comprimir(file,max=600,q=.68){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',q))};img.onerror=()=>rej(new Error('img'));img.src=u})}
async function subirFoto(inp){const f=inp.files?.[0];inp.value='';if(!f)return;toast('Guardando foto…');
  let img;try{img=await comprimir(f)}catch(e){return toast('No se pudo leer esa imagen. Prueba con otra foto.')}
  const id='f'+uid(),d={img,pose:S.pose,fecha:Date.now()};
  if(await escribir(async()=>{await S.db.doc(PRIV()+'/fotos/'+id).set(d);if(S.perfil?.compartir)await S.db.doc(BASE()+'/fotos/'+id).set(d)},'Foto guardada'))S.cmpB=id}
function elegirFoto(id){if(id===S.cmpA||id===S.cmpB){if(id===S.cmpB)S.cmpB=null;else S.cmpA=null}else if(!S.cmpA)S.cmpA=id;else S.cmpB=id;
  const F=S.fotos;const a=F.find(f=>f.id===S.cmpA),b=F.find(f=>f.id===S.cmpB);if(a&&b&&a.fecha>b.fecha)[S.cmpA,S.cmpB]=[S.cmpB,S.cmpA];render()}
function moverCmp(v){S.cmpPos=+v;$('#cmpTop').style.clipPath=`inset(0 ${100-v}% 0 0)`;$('#cmpBar').style.left=v+'%'}
async function borrarFoto(b){const id=S.cmpB||S.cmpA;if(!b.dataset.ok){b.dataset.ok=1;b.textContent='Toca otra vez para eliminarla';return}
  if(await escribir(async()=>{await S.db.doc(PRIV()+'/fotos/'+id).delete();await S.db.doc(BASE()+'/fotos/'+id).delete().catch(()=>{})},'Foto eliminada')){if(id===S.cmpB)S.cmpB=null;else S.cmpA=null}}
async function toggleCompartir(b){if(b.disabled)return;b.disabled=true;const on=!S.perfil?.compartir;
  const ok=await escribir(async()=>{
    await S.db.doc(BASE()).update({compartir:on});
    if(on){for(const m of S.med){const{id,...d}=m;await S.db.doc(BASE()+'/medidas/'+id).set(d)}for(const f of S.fotos){const{id,...d}=f;await S.db.doc(BASE()+'/fotos/'+id).set(d)}}
    else for(const c of ['medidas','fotos']){const q=await S.db.collection(BASE()+'/'+c).get();for(const d of q.docs)await S.db.doc(BASE()+'/'+c+'/'+d.id).delete()}
  },on?'Tu coach ya puede ver tu progreso':'Dejaste de compartir medidas y fotos');b.disabled=false}

/* ================= Estadísticas ================= */
/* 1RM estimado (fórmula de Epley). Los calentamientos nunca cuentan. */
const e1rm=(kg,reps)=>kg>0&&reps>0?(reps===1?kg:kg*(1+Math.min(reps,15)/30)):0;
const efectivas=sets=>(sets||[]).filter(x=>x.t!=='w');
const setsTxt=sets=>(sets||[]).map(x=>`${x.t&&x.t!=='n'?TIPOS[x.t].c+' ':''}${fmt(x.kg)}×${x.reps}${x.rpe?' @'+fmt(x.rpe):''}`).join(' · ');
/* Sesiones de un ejercicio, de la más vieja a la más nueva */
function sesionesDe(H,n){const out=[];for(const h of H){const e=(h.detalle||[]).find(x=>x.nombre===n);if(!e)continue;const ef=efectivas(e.sets);if(!ef.length)continue;
  out.push({fecha:h.fecha,sets:e.sets,max:Math.max(...ef.map(x=>x.kg)),rm:Math.round(Math.max(...ef.map(x=>e1rm(x.kg,x.reps)))*10)/10,vol:ef.reduce((a,x)=>a+x.kg*x.reps,0)})}
  return out.reverse()}
function ejerciciosHechos(H){const m=new Map();for(const h of H)for(const e of h.detalle||[]){const ef=efectivas(e.sets);if(!ef.length)continue;
  const o=m.get(e.nombre)||{nombre:e.nombre,n:0,ult:0,rm:0};o.n++;o.ult=Math.max(o.ult,h.fecha);o.rm=Math.max(o.rm,...ef.map(x=>e1rm(x.kg,x.reps)));m.set(e.nombre,o)}
  return [...m.values()].sort((a,b)=>b.ult-a.ult)}
function seriesPorGrupo(H,desde){const m={};for(const h of H){if(h.fecha<desde)continue;for(const e of h.detalle||[]){const n=efectivas(e.sets).length;if(n){const g=grupoDe(e.nombre);m[g]=(m[g]||0)+n}}}
  return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function porSemana(H,n=12){const L=lunes(Date.now()),w=[];for(let i=n-1;i>=0;i--)w.push({ini:L-i*7*DIA,entrenos:0,volumen:0,series:0});
  for(const h of H){const x=w.find(s=>h.fecha>=s.ini&&h.fecha<s.ini+7*DIA);if(x){x.entrenos++;x.volumen+=h.volumen||0;x.series+=h.series||0}}return w}

/* Gráficas: un solo color, trazo fino, rejilla discreta; al tocar un punto o barra se lee su valor arriba */
const GR={};
function lectura(id,i){const p=GR[id]?.[i],el=$('#'+id+'-l');if(!p||!el)return;el.textContent=p.txt;
  document.querySelectorAll(`#${id} [data-i]`).forEach(m=>m.classList.toggle('sel',+m.dataset.i===i))}
function graficoLinea(id,P,nombre){
  if(P.length<2)return `<div class="small">Con dos sesiones o más aparece la gráfica.</div>`;
  GR[id]=P;const W=330,H=160,l=40,r=10,t=12,b=24,vs=P.map(p=>p.v);let mn=Math.min(...vs),mx=Math.max(...vs);const pad=(mx-mn)*.15||mx*.1||1;mn=Math.max(0,mn-pad);mx+=pad;
  const t0=P[0].t,tr=(P.at(-1).t-t0)||1,X=x=>(l+(x-t0)/tr*(W-l-r)).toFixed(1),Y=v=>(t+(mx-v)/(mx-mn)*(H-t-b)).toFixed(1),u=P.length-1;
  const rej=[0,.5,1].map(f=>{const v=mn+(mx-mn)*f;return `<line x1="${l}" x2="${W-r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="0" y="${+Y(v)+4}">${fmt(Math.round(v))}</text>`}).join('');
  return `<div class="lect num" id="${id}-l" aria-live="polite">${esc(P[u].txt)}</div>
   <svg class="chart" id="${id}" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(nombre)}: de ${fmt(P[0].v)} a ${fmt(P[u].v)}">${rej}
   <path d="${P.map((p,i)=>(i?'L':'M')+X(p.t)+','+Y(p.v)).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
   ${P.map((p,i)=>`<circle class="pt ${i===u?'sel':''}" data-i="${i}" cx="${X(p.t)}" cy="${Y(p.v)}" r="4"/>`).join('')}
   ${P.map((p,i)=>`<circle cx="${X(p.t)}" cy="${Y(p.v)}" r="15" fill="transparent" onclick="lectura('${id}',${i})" onpointerenter="lectura('${id}',${i})"><title>${esc(p.txt)}</title></circle>`).join('')}
   <text x="${l}" y="${H-6}">${fecha(t0)}</text><text x="${W-r}" y="${H-6}" text-anchor="end">${fecha(P[u].t)}</text></svg>`}
const barraP=(x,y,w,h,r)=>{r=Math.min(r,w/2,h);return `M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z`};
function graficoBarras(id,P,nombre){GR[id]=P;
  const W=330,H=150,t=10,b=22,n=P.length,gap=4,bw=(W-gap*(n-1))/n,mx=Math.max(...P.map(p=>p.v),1),base=H-b,u=n-1;

   ${P.map((p,i)=>{const x=i*(bw+gap),h=p.v>0?Math.max(3,p.v/mx*(base-t)):0;return h?`<path class="br ${i===u?'sel':''}" data-i="${i}" d="${barraP(x,base-h,bw,h,4)}"/>`:''}).join('')}
   ${P.map((p,i)=>`<rect x="${i*(bw+gap)}" y="0" width="${bw+gap}" height="${H}" fill="transparent" onclick="lectura('${id}',${i})" onpointerenter="lectura('${id}',${i})"><title>${esc(p.txt)}</title></rect>`).join('')}
   ${P.map((p,i)=>(u-i)%4===0?`<text x="${i===u?W:i*(bw+gap)+bw/2}" y="${H-6}" text-anchor="${i===u?'end':'middle'}">${esc(p.lab)}</text>`:'').join('')}</svg>`}
function calendario(H){const base=new Date();base.setHours(0,0,0,0);base.setDate(1);base.setMonth(base.getMonth()+(S.calMes||0));

  H.forEach(h=>{const d=new Date(h.fecha);if(d.getFullYear()===y&&d.getMonth()===mo)(dia[d.getDate()]=dia[d.getDate()]||[]).push(h)});
  GR.cal=dia;const n=Object.values(dia).reduce((a,x)=>a+x.length,0);

   <div style="text-align:center"><b>${(m=>m[0].toUpperCase()+m.slice(1))(base.toLocaleDateString('es-CR',{month:'long'}))} ${y}</b><div class="small">${n} entreno${n===1?'':'s'}</div></div>
   <button class="iconbtn" style="transform:scaleX(-1)" onclick="S.calMes=Math.min(0,(S.calMes||0)+1);render()" ${(S.calMes||0)>=0?'disabled':''} aria-label="Mes siguiente">${IC.back}</button></div>
   <div class="cal">${LETRAS.map(l=>`<span class="tiny">${l}</span>`).join('')}${'<span></span>'.repeat(off)}${Array.from({length:nd},(_,i)=>{const d=i+1,on=!!dia[d],es=new Date(y,mo,d).toDateString()===hoy;
     return `<button class="${on?'on':''} ${es?'hoy':''}" ${on?`onclick="verDia(${d})" aria-label="${d}: ${dia[d].length} entreno${dia[d].length>1?'s':''}"`:`tabindex="-1" aria-hidden="true"`}>${d}</button>`}).join('')}</div>

function verDia(d){const L=GR.cal?.[d];if(!L)return;$('#cal-l').textContent=L.map(h=>`${h.titulo} · ${h.min} min · ${kg(h.volumen)} kg`).join(' — ')}
function musculos(H){const P=seriesPorGrupo(H,Date.now()-30*DIA);if(!P.length)return '<div class="small">Cuando entrenes, aquí ves cuántas series le das a cada músculo.</div>';const mx=P[0][1];

function progResumen(){const H=S.hist,w=porSemana(H),est=w.at(-1),ant=w.at(-2),rc=racha(),k=S.semVar||'entrenos';

/* ================= Progresión automática ================= */
/* Doble progresión: si la vez pasada completaste las reps objetivo en todas las series de trabajo
   con RPE 8 o menos, sube el peso; si no, mantenlo y busca más reps. */
const progresionActiva=()=>S.esOwner?ls.get('gf-prog',true):S.acceso?.progAuto!==false;
function sugerencia(nombre,obj){if(!obj)return null;const prev=ultimo(nombre);if(!prev)return null;const ef=prev.filter(x=>x.t!=='w');if(!ef.length)return null;
  const top=Math.max(...ef.map(x=>x.kg));if(!top)return null;const S2=ef.filter(x=>x.kg===top),rp=S2.map(x=>x.rpe).filter(Boolean),rpe=rp.length?Math.max(...rp):null;
  const cumplio=S2.every(x=>x.reps>=obj),paso=top>=20?2.5:1;
  if(cumplio&&(rpe==null||rpe<=8))return{kg:top+paso,accion:'sube',txt:`Sube ${fmt(paso)} kg: la vez pasada hiciste ${obj} reps${rpe?' con RPE '+fmt(rpe):''}`};
  if(cumplio)return{kg:top,accion:'igual',txt:`Mantén ${fmt(top)} kg: llegaste a las reps pero con RPE ${fmt(rpe)}`};
  return{kg:top,accion:'igual',txt:`Mantén ${fmt(top)} kg y busca llegar a ${obj} reps`}}

/* ================= Retos entre clientes ================= */
const TRETO={entrenos:['Más entrenos','entrenos',H=>H.length],series:['Más series','series',H=>H.reduce((a,h)=>a+(h.series||0),0)],volumen:['Más volumen','kg',H=>Math.round(H.reduce((a,h)=>a+(h.volumen||0),0))]};
const retoActivo=r=>r.desde<=Date.now()&&r.hasta>=Date.now();
const valorReto=(r,H)=>(TRETO[r.tipo]||TRETO.entrenos)[2](H.filter(h=>h.fecha>=r.desde&&h.fecha<=r.hasta));
const restan=r=>{const d=Math.ceil((r.hasta-Date.now())/DIA);return d<=0?'termina hoy':d===1?'queda 1 día':`quedan ${d} días`};
function tarjetaRetos(){const R=(S.retos||[]).filter(r=>r.hasta>=Date.now()-3*DIA).sort((a,b)=>a.hasta-b.hasta);if(!R.length)return'';
  return `<section class="card"><b>Retos del gimnasio</b>${R.map(r=>{const t=TRETO[r.tipo]||TRETO.entrenos,yo=S.retoYo?.[r.id],v=valorReto(r,S.hist);

   <span class="small">En el ranking solo se ve tu nombre y tu número.</span></section>`}

  if(await escribir(()=>S.db.doc(`retos/${id}/participantes/${S.me}`).set({alias:(S.perfil?.alias||S.meName||'Cliente').slice(0,40),valor:valorReto(r,S.hist),act:Date.now()}),'¡Te uniste al reto!'))verRanking(id)}
async function salirReto(id){if(await escribir(()=>S.db.doc(`retos/${id}/participantes/${S.me}`).delete(),'Saliste del reto')){cerrarHoja();cortar('ranking')}}
function actualizarRetos(H){for(const r of S.retos||[])if(retoActivo(r)&&S.retoYo?.[r.id])S.db.doc(`retos/${r.id}/participantes/${S.me}`).update({valor:valorReto(r,H),act:Date.now()}).catch(()=>{})}

  const pintar=L=>{if(!$('#sheet')||$('#sheet').hidden&&L!==null)return;const t=TRETO[r.tipo]||TRETO.entrenos;

     <div class="body"><span class="small">${fecha(r.desde)} al ${fecha(r.hasta)} · ${t[0].toLowerCase()} · ${retoActivo(r)?restan(r):'terminado'}</span>
     ${L===null?'<div class="cargando">Cargando…</div>':L.length?L.map((p,i)=>`<div class="list-row" style="${p.id===S.me?'background:var(--raise);border-radius:12px;padding-inline:8px':''}"><b class="num" style="width:28px;color:${i<3?'var(--gold)':'var(--muted)'}">${i+1}</b>${avatar(p.alias,'avatar')}<span class="grow">${esc(p.alias)}${p.id===S.me?' (tú)':''}</span><b class="num">${kg(p.valor)} <span class="tiny">${t[1]}</span></b></div>`).join(''):'<div class="empty">Todavía nadie se une.</div>'}
     ${S.modo==='cliente'&&S.retoYo?.[id]?`<button class="btn ghost block" onclick="salirReto(${J(id)})">Salir del reto</button>`:''}</div>`)};
  pintar(null);sub('ranking',S.db.collection(`retos/${id}/participantes`).orderBy('valor','desc').limit(30),s=>pintar(docs(s)))}

/* Resumen que la app del cliente calcula al guardar un entreno, para que el coach vea tendencias
   sin descargar todo el historial: entrenos de la semana, récords del mes y ejercicios estancados. */
function tendencias(H){const L=lunes(Date.now()),hace30=Date.now()-30*DIA,estanc=[],sube=[];
  for(const e of ejerciciosHechos(H)){const P=sesionesDe(H,e.nombre);if(P.length<4||e.ult<hace30)continue;
    const antes=Math.max(...P.slice(0,-3).map(p=>p.rm)),ult3=Math.max(...P.slice(-3).map(p=>p.rm));
    if(ult3<=antes)estanc.push(e.nombre);else sube.push(e.nombre)}
  return{sem:{ini:L,n:H.filter(h=>h.fecha>=L).length},ses30:H.filter(h=>h.fecha>=hace30).length,prs30:H.filter(h=>h.fecha>=hace30).reduce((a,h)=>a+(h.prs?.length||0),0),estanc:estanc.slice(0,5),sube:sube.slice(0,5),act:Date.now()}}

/* ================= COACH: Clientes ================= */
function estado(c){if(!c.ultimo)return['Nuevo','nada'];const d=dias(c.ultimo);
  if(d<=2&&c.ultPRs)return['Récord','pr'];if(d<=2)return['Entrenó','ok'];if(d>=7)return[`${d} días`,'alerta'];return[`${d} días`,'nada']}
function detalleLinea(c){if(!c.ultimo)return c.alta?`Se unió ${hace(c.alta)}`:'Aún no entrena';return `${c.ultTitulo||'Entreno'} · ${hace(c.ultimo)} · ${c.ultMin||0} min${c.ultPRs?` · ${c.ultPRs} récord${c.ultPRs>1?'s':''}`:''}`}
const semanaDe=c=>c.tend?.sem?.ini===lunes(Date.now())?c.tend.sem.n:0;
const estancado=c=>!!c.tend?.estanc?.length&&c.ultimo&&dias(c.ultimo)<30;
const progresa=c=>(c.tend?.prs30||0)>0&&c.ultimo&&dias(c.ultimo)<30;
const conDolor=c=>!!dolorDe(c)&&dias(c.dolor.fecha)<30;
const atencion=c=>!c.ultimo||dias(c.ultimo)>=7||estancado(c)||conDolor(c)||!!c.compPend||(c.id!==S.me&&pago(accesoDe(c.id)).k==='venc');
function lineaTend(c){const t=c.tend;if(!t||!c.ultimo)return'';const p=[`${semanaDe(c)} esta semana`];
  if(t.prs30)p.push(`${t.prs30} récord${t.prs30>1?'s':''} en 30 días`);
  return `<span class="small" style="display:block">${p.join(' · ')}${estancado(c)?` · <span style="color:var(--warn)">estancado en ${esc(t.estanc[0])}${t.estanc.length>1?' y '+(t.estanc.length-1)+' más':''}</span>`:''}</span>`}

  const activos=C.filter(c=>c.ultimo&&dias(c.ultimo)<=2).length,nAt=C.filter(atencion).length,nPr=C.filter(progresa).length;

  const f=F[S.filtro]||F.todos;let lista=[...C].filter(f[0]).sort((a,b)=>(b.ultimo||0)-(a.ultimo||0));

    <span class="small" style="color:var(--ok-fg)">Mándales el enlace de Genefit. Entran, tocan «Soy nuevo», crean su cuenta con correo y clave, y aparecen aquí.</span>

   <div class="grid3"><div class="tile"><span class="big">${C.length}</span><span class="tiny">Clientes</span></div><div class="tile"><span class="big" style="color:var(--accent)">${activos}</span><span class="tiny">Entrenaron hoy o ayer</span></div><div class="tile"><span class="big" style="color:var(--warn)">${nAt}</span><span class="tiny">Necesitan atención</span></div></div>
   <div class="chips" role="group" aria-label="Filtro de clientes">${Object.entries(F).map(([k,[,l,n]])=>`<button class="chip" aria-pressed="${(S.filtro||'todos')===k}" onclick="S.filtro='${k}';render()">${l} · ${n}</button>`).join('')}</div>`;
  h+=lista.length?`<div class="stack s8">${lista.map(c=>{const [t,k]=estado(c),n=nombreCliente(c);return `<button class="card" style="padding:12px;border:0;text-align:left;color:var(--fg);flex-direction:row;align-items:center" onclick="abrirCliente(${J(c.id)})">${avatar(n)}<span class="grow" style="min-width:0"><b style="display:block">${esc(n)}${c.id===S.me?' (tú)':''}</b><span class="small" style="display:block">${esc(detalleLinea(c))}</span>${lineaTend(c)}</span><span class="pills"><span class="pill ${k}">${t}</span>${estancado(c)?'<span class="pill alerta">Estancado</span>':''}${conDolor(c)?'<span class="pill mal">Dolor</span>':''}${c.compPend?'<span class="pill ok">Comprobante</span>':''}${pillPago(c.id)}</span></button>`}).join('')}</div>`
    :`<div class="empty">${C.length?(S.filtro==='progresan'?'Nadie tiene récords en los últimos 30 días todavía.':'Nadie necesita atención. ¡Todos van al día!'):'Aún no tienes clientes. Cuando un cliente abra Genefit por primera vez, aparece aquí.'}</div>`;
  h+=cardRetosCoach();
  return h+`</div>${S.plantillas.length&&C.length?`<button class="btn primary fab" onclick="elegirPlantilla()">${IC.mas} Asignar rutina</button>`:''}`}

function detResumen(d,c,n){const dl=dolorDe(c),a=accesoDe(d.id);

async function suspender(cid,on,b){if(on&&b&&!b.dataset.ok){b.dataset.ok=1;b.textContent='Toca otra vez para suspender';return}

  await escribir(()=>S.db.doc('acceso/'+cid).set(datos,{merge:true}),on?'Acceso suspendido':limpiar?'Reactivado. Regístrale el pago cuando te pague.':'Acceso reactivado')}
async function eliminarCliente(cid,b){if(!b.dataset.ok){b.dataset.ok=1;b.textContent='Toca otra vez para eliminar (no se puede deshacer)';return}

  const C=[...S.clientes].sort((x,y)=>nombreCliente(x).localeCompare(nombreCliente(y),'es'));
  const keep=$('#asgNota')?.value;if(keep!=null)a.nota=keep;
  abrirHoja(`<div class="row between"><h2>Asignar «${esc(p.nombre)}»</h2><button class="iconbtn" onclick="cerrarHoja()" aria-label="Cerrar">${IC.x}</button></div>
   <div class="body"><div class="stack s8"><span class="lbl">Clientes</span>${C.length?C.map(c=>{const on=a.sel.has(c.id),n=nombreCliente(c);return `<button class="pick" role="checkbox" aria-checked="${on}" onclick="S.asg.sel.${on?'delete':'add'}(${J(c.id)});pintarAsignar()" style="${on?'background:var(--raise)':''}">${avatar(n,'avatar')}<span class="grow">${esc(n)}</span><span class="check ${on?'on':''}" aria-hidden="true">${IC.check}</span></button>`}).join(''):'<div class="notice" style="color:var(--fg)"><b>Todavía no tienes clientes.</b><br>Mándales el enlace de Genefit: crean su cuenta, escriben su nombre y aparecen aquí para asignarles la rutina.</div><button class="btn ghost sm" style="align-self:flex-start" onclick="compartirLink()">Compartir enlace</button>'}</div>
   <div class="stack s8"><span class="lbl">¿Qué días? (opcional)</span><div class="chips">${LETRAS.map((l,i)=>`<button class="chip" aria-pressed="${a.dias.has(i)}" aria-label="${NOMDIA[i]}" onclick="S.asg.dias.${a.dias.has(i)?'delete':'add'}(${i});pintarAsignar()" style="width:44px;padding:0">${l}</button>`).join('')}</div><span class="small">Sin días, la rutina entra en rotación con las demás.</span></div>
   <div class="field"><label class="lbl" for="asgNota">Nota para el cliente (opcional)</label><textarea class="input" id="asgNota" maxlength="200" placeholder="Ej: sube 2,5 kg en banca si las 8 reps salen limpias" oninput="S.asg.nota=this.value">${esc(a.nota)}</textarea></div>
   <button class="btn primary go" onclick="asignar()" ${a.sel.size?'':'disabled'}>Asignar a ${a.sel.size} cliente${a.sel.size===1?'':'s'}</button></div>`)}
async function asignar(){const a=S.asg,p=S.plantillas.find(x=>x.id===a.pid);if(!a.sel.size)return;const nota=($('#asgNota')?.value||'').trim().slice(0,200);
  const body={nombre:p.nombre,ejercicios:p.ejercicios,dias:[...a.dias].sort(),nota,fecha:Date.now(),plantilla:p.id};const n=a.sel.size;
  for(const cid of a.sel){if(!await escribir(()=>S.db.doc(`clientes/${cid}/asignadas/${p.id}`).set(body)))return}
  cerrarHoja();toast(`«${p.nombre}» asignada a ${n} cliente${n===1?'':'s'}`)}

/* ================= COACH: Mensajes ================= */
function vMensajes(){const C=[...S.clientes].sort((a,b)=>(b.ultMsg?.fecha||0)-(a.ultMsg?.fecha||0));pedirNombres(C.map(c=>c.id));const v=ls.get('gf-visto',{});
  return `<div class="stack" style="padding-top:12px"><h1>Mensajes</h1>${C.length?`<div class="stack s8">${C.map(c=>{const n=nombreCliente(c),u=c.ultMsg,nuevo=u&&u.de!==S.me&&u.fecha>(v[c.id]||0);
    return `<button class="card" style="padding:12px;border:0;text-align:left;color:var(--fg);flex-direction:row;align-items:center" onclick="abrirChat(${J(c.id)})">${avatar(n)}<span class="grow" style="min-width:0"><b style="display:block">${esc(n)}</b><span class="small" style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${u?(u.de===S.me?'Tú: ':'')+esc(u.texto):'Sin mensajes'}</span></span>${u?`<span class="tiny">${hace(u.fecha)}</span>`:''}${nuevo?'<span class="pill ok">Nuevo</span>':''}</button>`}).join('')}</div>`:'<div class="empty">Cuando tengas clientes, aquí conversas con cada uno.</div>'}</div>`}
function abrirChat(cid){cortar('chat');S.chat={cid,msgs:[]};S.chat.volver=S.vista;
  sub('chat',S.db.collection('clientes/'+cid+'/mensajes').orderBy('fecha','desc').limit(150),s=>{if(S.chat){S.chat.msgs=docs(s).reverse();marcarVisto(cid)}});
  S.vista='chat';render()}
function cerrarChat(){if(!S.chat)return;const v=S.chat.volver;cortar('chat');S.chat=null;S.vista=v==='cliente'&&S.det?'cliente':null;render()}
function vChat(){const c=S.clientes.find(x=>x.id===S.chat.cid)||{id:S.chat.cid},n=nombreCliente(c);
  return `<div class="stack" style="padding-top:18px"><div class="row"><button class="iconbtn" onclick="cerrarChat()" aria-label="Volver">${IC.back}</button>${avatar(n)}<h1 class="grow" style="font-size:22px">${esc(n)}</h1></div>${hiloHTML(S.chat.msgs)}${cajaMsg(S.chat.cid)}</div>`}

/* ================= App instalable ================= */
let pedirInstalar=null;
const esIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
const instalada=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();pedirInstalar=e;programar()});
addEventListener('appinstalled',()=>{pedirInstalar=null;toast('¡Genefit quedó instalada!');programar()});
function bannerInstalar(){if(instalada()||ls.get('gf-noinstalar',false)||(!pedirInstalar&&!esIOS))return'';
  return `<section class="card line" style="flex-direction:row;align-items:center;gap:12px"><img src="icons/icon-192.png" alt="" width="44" height="44" style="border-radius:12px;flex:none"><div class="grow"><b>Instala Genefit</b><div class="small">${pedirInstalar?'Ábrela como app desde tu pantalla de inicio, también sin señal.':'Toca <b>Compartir</b> y luego <b>«Agregar a pantalla de inicio»</b>.'}</div></div>
   ${pedirInstalar?`<button class="btn sm primary" onclick="instalar()">Instalar</button>`:''}<button class="iconbtn" onclick="ls.set('gf-noinstalar',true);render()" aria-label="No mostrar más">${IC.x}</button></section>`}
async function instalar(){if(!pedirInstalar)return;pedirInstalar.prompt();try{await pedirInstalar.userChoice}catch(e){}pedirInstalar=null;render()}
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(e=>console.warn('sw',e)));

init();
</script>
</body>
</html>
